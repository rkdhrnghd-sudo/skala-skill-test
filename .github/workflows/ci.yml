name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7
      - name: Python 설치
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 패키지 설치
        run: pip install -r requirements-dev.txt
      - name: 테스트 실행
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7
      - name: 포장하기
        run: docker build -t hackathon-app:${{ github.sha }} .
      - name: 켜서 확인하기
        run: |
          docker run -d --name app -p 8000:8000 hackathon-app:${{ github.sha }}
          for _ in $(seq 1 15); do
            if curl -sf http://localhost:8000/health && curl -sf -o /dev/null http://localhost:8000/; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
