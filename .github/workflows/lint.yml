name: Lint workflows
on:
  pull_request:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
